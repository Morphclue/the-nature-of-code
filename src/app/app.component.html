<div class="container">
  <aside class="sidebar" aria-label="Sketch list">
    <div class="sidebar-header">
      <input class="search" placeholder="Search sketches..." (input)="onQuery($event)" />
    </div>
    <ul>
      @for (sketch of filteredSketches; track sketch) {
        <li (click)="selectSketch(sketch)" [class.active]="selectedSketch === sketch.sketch">
          <div class="avatar">{{ sketch.name[0] }}</div>
          <div class="name">{{ sketch.name }}</div>
          <div class="chev">›</div>
        </li>
      }
    </ul>
  </aside>
  <main class="content">
    <app-p5 [sketch]="selectedSketch"></app-p5>
  </main>
</div>
